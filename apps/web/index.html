<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c10" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%branding/logo-32.png" />
    <link rel="icon" sizes="any" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%branding/logo-180.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <link rel="stylesheet" href="%BASE_URL%startup.css" />
    <link rel="preload" as="image" href="%BASE_URL%art/lore/key-art-clean.webp" />
    <title>Shattered Rifts: a free roguelike deckbuilder card game in your browser</title>
    <!-- what a search result or a shared link says about the game -->
    <meta
      name="description"
      content="Shattered Rifts is a free roguelike deckbuilder you play in your browser. Pick one of ten Riftwalkers, build a deck through twenty Rift Tiers of card battles and traps, then take it into the Arena against other players."
    />
    <link rel="canonical" href="https://shatteredrifts.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shattered Rifts" />
    <meta property="og:url" content="https://shatteredrifts.app/" />
    <meta property="og:title" content="Shattered Rifts: a free roguelike deckbuilder" />
    <meta
      property="og:description"
      content="Pick a Riftwalker, build a deck through twenty Rift Tiers of card battles and traps, then duel other players in the Arena. Free, in your browser."
    />
    <meta property="og:image" content="https://shatteredrifts.app/lore-social.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Four Riftwalkers face the shattered Ward between worlds"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shattered Rifts: a free roguelike deckbuilder" />
    <meta
      name="twitter:description"
      content="Pick a Riftwalker, build a deck through twenty Rift Tiers of card battles and traps, then duel other players in the Arena. Free, in your browser."
    />
    <meta name="twitter:image" content="https://shatteredrifts.app/lore-social.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Shattered Rifts",
        "url": "https://shatteredrifts.app/",
        "description": "A free roguelike deckbuilder card game you play in your browser: pick one of ten Riftwalkers, build a deck through twenty Rift Tiers of card battles and traps, then take it into the Arena against other players.",
        "genre": ["Roguelike", "Deckbuilder", "Card game", "Strategy"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "image": "https://shatteredrifts.app/lore-social.jpg",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <main class="startup" aria-labelledby="startup-title">
        <div class="startup__content">
          <img src="%BASE_URL%branding/logo-192.png" width="120" height="120" alt="" />
          <h1 id="startup-title">Shattered Rifts</h1>
          <p class="startup__story">
            The Ward is broken.<br />Every world has something worth saving.
          </p>
          <p class="startup__status" id="startup-status" role="status">
            Preparing your next crossing…
          </p>
          <progress id="startup-progress" aria-label="Loading Riftwalker artwork"></progress>
          <div class="startup__actions">
            <button id="startup-continue" type="button" hidden>Continue while artwork loads</button
            ><button id="startup-quit" type="button" hidden>Quit to Desktop</button>
          </div>
        </div>
      </main>
    </div>
    <noscript
      >Shattered Rifts is a free roguelike deckbuilder card game. It needs JavaScript to
      play.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
