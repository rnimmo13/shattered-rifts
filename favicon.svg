<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f3068"/>
      <stop offset="0.6" stop-color="#0c1330"/>
      <stop offset="1" stop-color="#04050b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc94"/>
      <stop offset="0.55" stop-color="#d4a84b"/>
      <stop offset="1" stop-color="#7a5a1e"/>
    </linearGradient>
    <linearGradient id="rift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6f4ff"/>
      <stop offset="0.5" stop-color="#b99aff"/>
      <stop offset="1" stop-color="#8f5bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- the rift: a jagged tear running down the middle -->
  <path d="M35 9 L27 27 L36 31 L26 47 L31 55 L38 40 L30 36 L40 21 Z" fill="url(#rift)" filter="url(#glow)"/>
  <path d="M35 12 L29.5 27.5 L37.5 31 L29 45" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
